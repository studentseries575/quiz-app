<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container text-center mt-5" id="startScreen">
  <div class="glass p-5">
    <h1 class="title">🧠 Quiz App</h1>
    <p class="subtitle">Test your knowledge in a fun way 🚀</p>
    <button class="btn btn-start mt-3" onclick="startQuiz()">Start Quiz</button>
  </div>
</div>

<div class="container mt-5 d-none" id="quizBox">
  <div class="quiz-card p-4">

    <div class="d-flex justify-content-between align-items-center">
      <h5>Question <span id="qNo"></span>/5</h5>
      <span id="time" class="timer"></span>
    </div>

    <div id="progressContainer" class="d-flex mt-3"></div>

    <h4 id="question" class="mt-4"></h4>

    <div id="options"></div>

    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-warning" onclick="prevQ()">⬅ Previous</button>
      <button class="btn btn-primary" onclick="nextQ()">Next ➜</button>
      <button class="btn btn-light" onclick="toggleMode()">🌙 Mode</button>
    </div>

  </div>
</div>

<div class="container mt-5 d-none" id="resultBox"></div>

<script src="script.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</body>
</html>
